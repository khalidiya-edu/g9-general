<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>منصة تمكن</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 80% 0,rgba(212,177,106,.18),transparent 60%),linear-gradient(160deg,#0E1A2B,#16263D);color:#F4EFE3;font-family:"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
.c{max-width:420px}.l{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:4px solid rgba(212,177,106,.25);border-top-color:#D4B16A;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
h1{margin:0 0 8px;font-size:1.5rem}p{color:#cdbf9a;line-height:1.8;margin:6px 0}.e .l{display:none}.e h1{color:#f0765c}
</style>
</head>
<body><div class="c" id="c"><div class="l"></div><h1 id="h">جاري تجهيز المنصة…</h1><p id="p">يستغرق هذا ثوانيَ في أول مرة فقط.</p></div>
<script src="boot.js"></script>
</body>
</html>
